<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Générateur JSON Intelligent</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 650px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        textarea { resize: vertical; min-height: 100px; }
        .btn-gen { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-gen:hover { background: #0369a1; }
        .output-box { margin-top: 25px; display: none; }
        .btn-copy { width: 100%; padding: 10px; background: #22c55e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-copy:hover { background: #16a34a; }
        small { color: #64748b; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>مولد كود المطاعم الآمن (BITE) 🍔</h2>
    
    <div class="form-group">
        <label>أين تريد وضع هذا المطعم في الملف؟ (Position):</label>
        <select id="position">
            <option value="end">في الأخير (Dernier / Fin de liste)</option>
            <option value="start">في البداية (Premier / Début de liste)</option>
        </select>
    </div>

    <div class="form-group">
        <label>اسم المطعم (Nom du restaurant):</label>
        <input type="text" id="name" placeholder="Ex: Kebdati Hut">
    </div>

    <div class="form-group">
        <label>رقم الهاتف (Téléphone):</label>
        <input type="text" id="phone" placeholder="Ex: 031921122">
    </div>

    <div class="form-group">
        <label>رابط صورة البروفايل (Photo de Profil):</label>
        <input type="text" id="profileImg" placeholder="https://images.unsplash.com/...">
    </div>

    <div class="form-group">
        <label>روابط صور المنيو (ضع كل رابط في سطر جديد):</label>
        <textarea id="menuImages" placeholder="https://link1.com/img1.jpg&#10;https://link2.com/img2.jpg"></textarea>
        <small>قم بلصق رابط كل صورة في سطر مستقل</small>
    </div>

    <button class="btn-gen" onclick="generateJSON()">توليد الكود الآمن (Générer)</button>

    <div class="output-box" id="outputBox">
        <label>الكود الناتِج (انسخه وضعه في المكان المناسب):</label>
        <textarea id="jsonOutput" readonly style="height: 150px; font-family: monospace; color: #38bdf8;"></textarea>
        <button class="btn-copy" onclick="copyJSON()">نسخ الكود 📋</button>
    </div>
</div>

<script>
    function generateJSON() {
        const position = document.getElementById('position').value;
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const profileImg = document.getElementById('profileImg').value.trim();
        const menuRaw = document.getElementById('menuImages').value;

        const menuImages = menuRaw
            .split('\n')
            .map(url => url.trim())
            .filter(url => url.length > 0);

        if(!name || !phone || !profileImg) {
            alert('يرجى ملء جميع الخانات الأساسية!');
            return;
        }

        const restaurantData = {
            name: name,
            profileImg: profileImg,
            phone: phone,
            menuImages: menuImages
        };

        // تحويل الكائن إلى نص منسق
        let formatted = JSON.stringify(restaurantData, null, 4);

        // إضافة الفاصلة بدقة بناءً على مكان المطعم لكي لا يحدث أي خطأ أبداً
        if (position === 'end') {
            // إذا كان في الأخير، نضيف `,` في البداية ليلتصق بالمطعم الذي قبله
            formatted = ",\n" + formatted;
        } else {
            // إذا كان في البداية، نضيف `,` في النهاية ليلتصق بالمطعم الذي بعده
            formatted = formatted + ",";
        }
        
        document.getElementById('jsonOutput').value = formatted;
        document.getElementById('outputBox').style.display = 'block';
    }

    function copyJSON() {
        const copyText = document.getElementById("jsonOutput");
        copyText.select();
        document.execCommand("copy");
        alert("تم النسخ بنجاح!");
    }
</script>

</body>
</html>
